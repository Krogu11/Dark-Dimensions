<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Dimensions - Yugioh Style Prototype</title>
<style>
body{margin:0;font-family:Arial;background:#0b0b12;color:white}
h1{text-align:center;margin:5px}
#top{text-align:center}
button{padding:8px;margin:5px;background:#222;color:#fff;border:1px solid #555;cursor:pointer}
#board{display:flex;flex-direction:column;align-items:center}
.field{display:grid;grid-template-columns:repeat(5,110px);gap:10px;margin:10px}
.slot{width:110px;height:150px;border:2px dashed #444;display:flex;align-items:center;justify-content:center;position:relative}
.card{width:100px;height:140px;border-radius:8px;border:2px solid gold;background:#1c1c2e;padding:5px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:.2s}
.card:hover{transform:scale(1.1)}
.hand{display:flex;gap:8px;margin:10px}
.hidden{background:#333;border:2px solid #999}
.attack{outline:3px solid red}
defense{outline:3px solid cyan}
#preview{position:fixed;right:10px;top:10px;width:200px;height:280px;border:2px solid gold;background:#111;padding:10px}
#log{height:120px;overflow:auto;font-size:12px;border-top:1px solid #333;padding:5px}
</style>
</head>
<body>
<h1>Dark Dimensions</h1>
<div id="top">
LP: <span id="pLP">4000</span> | Enemy: <span id="eLP">4000</span><br>
Phase: <span id="phase">Draw</span>
<button onclick="nextPhase()">Next Phase</button>
</div>
<div id="board">
<div class="field" id="enemyField"></div>
<div class="field" id="playerField"></div>
<div class="hand" id="hand"></div>
</div>
<div id="preview">Hover Karte</div>
<div id="log"></div>
<script>
let playerLP=4000, enemyLP=4000;
let phaseIndex=0;
let phases=["Draw","Main","Battle","End"];
let selectedCard=null, attacker=null;

// Karten mit Tribute-Leveln
let cardPool=[
{name:"Soldier",atk:1200,def:1000,level:4,effect:null},
{name:"Priest",atk:800,def:1500,level:3,effect:"heal"},
{name:"Dragon",atk:2500,def:2000,level:7,effect:"destroy"},
{name:"Giant",atk:2000,def:1800,level:6,effect:null},
{name:"Assassin",atk:1700,def:800,level:4,effect:"buff"}
];

let deck=[],hand=[];
let playerField=Array(5).fill(null);
let enemyField=Array(5).fill(null);

function initDeck(){deck=[...cardPool,...cardPool];shuffle(deck)}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}

function draw(){if(deck.length===0||hand.length>=6)return;hand.push({...deck.pop(),mode:"attack",hidden:false});log("Draw")}

function update(){pLP.innerText=playerLP;eLP.innerText=enemyLP;phase.innerText=phases[phaseIndex];renderField(playerField,true,"playerField");renderField(enemyField,false,"enemyField");renderHand()}

function renderField(arr,isPlayer,id){let el=document.getElementById(id);el.innerHTML="";arr.forEach((c,i)=>{let slot=document.createElement("div");slot.className="slot";if(c){let card=createCard(c);card.onmouseover=()=>preview(c);if(isPlayer){card.onclick=()=>selectAttacker(i)}else{card.onclick=()=>attack(i)}slot.appendChild(card)}else if(isPlayer && selectedCard!=null && phases[phaseIndex]=="Main"){slot.onclick=()=>summon(i)}el.appendChild(slot)})}

function renderHand(){let el=document.getElementById("hand");el.innerHTML="";hand.forEach((c,i)=>{let card=createCard(c);card.onmouseover=()=>preview(c);card.onclick=()=>selectedCard=i;el.appendChild(card)})}

function createCard(c){let d=document.createElement("div");d.className="card";if(c.hidden)d.classList.add("hidden");d.innerHTML=`<div>${c.name}</div><div>ATK:${c.atk}</div><div>DEF:${c.def}</div><div>LV:${c.level}</div>`;return d}

function preview(c){previewDiv.innerHTML=`<h3>${c.name}</h3>ATK:${c.atk}<br>DEF:${c.def}<br>LV:${c.level}<br>Effect:${c.effect||"None"}`}

function summon(i){let c=hand[selectedCard];let tributes=0;
if(c.level>=5)tributes=1;if(c.level>=7)tributes=2;
let available=playerField.filter(x=>x).length;
if(available<tributes){log("Nicht genug Tribute");return}

// Tribute entfernen
for(let t=0;t<tributes;t++){
 let idx=playerField.findIndex(x=>x);
 if(idx>=0) playerField[idx]=null;
}

playerField[i]=c;hand.splice(selectedCard,1);selectedCard=null;
applyEffect(c,true);
log("Summon "+c.name);
update();
}

function applyEffect(c,isPlayer){
 if(!c.effect)return;
 if(c.effect=="heal") playerLP+=500;
 if(c.effect=="buff") c.atk+=300;
 if(c.effect=="destroy"){let t=enemyField.findIndex(x=>x);if(t>=0)enemyField[t]=null}
}

function selectAttacker(i){attacker=i}

function attack(t){if(phases[phaseIndex]!="Battle"||attacker==null)return;
let a=playerField[attacker];let d=enemyField[t];

if(d){
 if(d.mode=="attack"){
  let diff=a.atk-d.atk;
  if(diff>0){enemyField[t]=null;enemyLP-=diff}
  else if(diff<0){playerField[attacker]=null;playerLP+=diff}
 }
 else{
  let diff=a.atk-d.def;
  if(diff>0) enemyField[t]=null;
  else if(diff<0) playerLP+=diff;
 }
}else{enemyLP-=a.atk}

attacker=null;checkWin();update();}

function enemyTurn(){
// smarter summon mit tribute
let strongest=[...cardPool].sort((a,b)=>b.atk-a.atk);
for(let c of strongest){
 let trib=(c.level>=7?2:c.level>=5?1:0);
 let available=enemyField.filter(x=>x).length;
 if(available>=trib){
  for(let t=0;t<trib;t++){let idx=enemyField.findIndex(x=>x);if(idx>=0)enemyField[idx]=null}
  let slot=enemyField.findIndex(x=>!x);
  if(slot>=0){enemyField[slot]={...c,mode:"attack"};break}
 }
}

// zielgerichteter Angriff
enemyField.forEach((c,i)=>{
 if(!c)return;
 let target=playerField.findIndex(x=>x);
 if(target>=0){
  let p=playerField[target];
  if(p.mode=="attack"){
   let diff=c.atk-p.atk;
   if(diff>=0) playerField[target]=null;
  }
 }else playerLP-=c.atk;
});
log("Enemy Turn");
}

function nextPhase(){phaseIndex++;if(phaseIndex>=phases.length){phaseIndex=0;enemyTurn()}if(phases[phaseIndex]=="Draw")draw();update()}

function checkWin(){if(enemyLP<=0){alert("Win");location.reload()}if(playerLP<=0){alert("Lose");location.reload()}}
function log(t){document.getElementById("log").innerHTML+=t+"<br>"}

let previewDiv=document.getElementById("preview");
let pLP=document.getElementById("pLP");
let eLP=document.getElementById("eLP");

initDeck();update();
</script>
</body>
</html>
